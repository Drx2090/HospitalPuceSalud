<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/formulario_hospital/hospitalico.jpg">
    <title>Historia Clínica</title>
</head>
<body>
    <h1 style="text-align: center; color:rgba(96, 43, 240, 0.74); font-family: Trebuchet MS, sans-serif" ;>HOSPITAL PUCESALUD</h1>
    <div style="text-align: center;">
        <img src="/formulario_hospital/pucesalud.jpg" alt="Hospital PuceSalud" width="500" height="320">
    </div>
    <hr>
    <p style="text-align: center; font-family: Comic Sans MS, sans-serif; color:blueviolet">-Por favor, llene este formulario con sus datos y obtenga un turno-</p>
    <hr>
    <form action="resultado_enviado.html" method="get">
        <label for="nombre"; style="color:rgb(228, 0, 0)"><strong>1. Nombre del paciente:</strong></label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escriba su nombre"
            required>
        <br><br>
        <label for="especie"; style="color:rgb(5, 37, 218)"><strong>2. Apellido del paciente:</strong></label>
        <input
            type="text"
            id="especie"
            name="especie"
            placeholder="Escriba su apellido"
            required>
        <br><br>
        <label for="edad"; style="color:rgb(228, 0, 0)"><strong>3. Edad del paciente:</strong></label>
        <input
            type="number"
            id="edad"
            name="edad"
            placeholder="Ingrese su edad"
            required>
        <br><br>
        <label for="fecha"; style="color:rgb(5, 37, 218)"><strong>4. Fecha de nacimiento:</strong></label>
        <input
            type="date"
            id="fecha"
            name="fecha"
            required>
        <br><br>
        <label for="cedula"; style="color:rgb(228, 0, 0)"><strong>5. Número de cédula:</strong></label>
        <input
            type="number"
            id="cedula"
            name="cedula"
            placeholder="Ingrese su n° de cédula"
            required>
        <br><br>
        <label for="genero"; style="color:rgb(5, 37, 218)"><strong>6. Género del paciente:</strong></label>
        <br>
        <input 
            type="radio"
            id="hombre"
            name="genero"
            required>
            <label for="hombre">Hombre</label>
        <br>
        <input
            type="radio"
            id="mujer"
            name="genero">
            <label for="mujer">Mujer</label>
        <br><br>
        <label for="peso"; style="color:rgb(228, 0, 0)"><strong>7. Peso del paciente (en kg):</strong></label>
        <input
            type="number"
            id="peso"
            name="peso"
            placeholder="Ingrese su peso"
            step="0.1"
            required>
        <br><br>
        <label for="direccion"; style="color:rgb(5, 37, 218)"><strong>8. Dirección domiciliaria:</strong></label>
        <input
            type="text"
            id="direccion"
            name="direccion"
            placeholder="Escriba dónde vive"
            required>
        <br><br>
        <label for="alimentacion"; style="color:rgb(228, 0, 0)"><strong>9. Estado civil:</strong></label>
        <select id="alimentacion" name="alimentacion" required>
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="casado_a">Casado/a</option>
            <option value="soltero_a">Soltero/a</option>
            <option value="divorciado_a">Divorciado/a</option>
            <option value="viudo_a">Viudo/a</option>
        </select>
        <br><br>
        <label for="sangre"; style="color:rgb(5, 37, 218)"><strong>10. Tipo de sangre:</strong></label>
        <select id="sangre" name="sangre" required>
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="a_positivo">A+</option>
            <option value="a_negativo">A-</option>
            <option value="b_positivo">B+</option>
            <option value="b_negativo">B-</option>
            <option value="ab_positivo">AB+</option>
            <option value="ab_negativo">AB-</option>
            <option value="o_positivo">O+</option>
            <option value="o_negativo">O-</option>
        </select>
        <br><br>
        <label for="cuidados"; style="color:rgb(228, 0, 0)"><strong>11. Cuidados especiales:</strong></label>
        <br>
        <input
            type="checkbox"
            id="embarazo"
            name="embarazo">
        <label for="embarazo">Embarazo o lactancia</label>
        <br>
        <input
            type="checkbox"
            id="discapacidad"
            name="discapacidad">
        <label for="discapacidad">Discapacidad física, intelectual o sensorial</label>
        <br>
        <input
            type="checkbox"
            id="conducta"
            name="conducta">
        <label for="conducta">Condición de salud mental o riesgo conductual</label>
        <br><br>
        <label for="observaciones"; style="color:rgb(5, 37, 218)"><strong>12. Observaciones:</strong></label>
        <br>
        <textarea
            id="observaciones"
            name="observaciones"
            rows="4"
            cols="40"
            placeholder="Describa que malestar o enfermedad padece de forma detallada"
            required></textarea>
        <br><br>
        <label for="correo" style="color:rgb(228, 0, 0)"><strong>13. Correo electrónico del paciente:</strong></label>
        <input 
        type="email" 
        id="correo" name="correo" 
        list="correos"
        placeholder="paciente@correo.com"
        required>
        <datalist id="correos">
            <option value="gmail.com">
            <option value="hotmail.com">
            <option value="outlook.com">
        </datalist>
        <br><br>
        <label for="fotografia"; style="color:rgb(5, 37, 218)"><strong>14. Fotografía del paciente:</strong></label>
        <input
            type="file"
            id="fotografia"
            name="fotografia"
            required>
        <br><br>
        <label for="color"; style="color:rgb(228, 0, 0)"><strong>15. Color de identificación: (Verde= Estable - Amarillo= Urgente Rojo= Crítico)</strong></label>
        <input
            type="color"
            id="color"
            name="color"
            required>
        <br><br>
        <input type="submit" value="Enviar">
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
